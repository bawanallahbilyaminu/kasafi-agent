        domains: [sbs.sk.gov.ng]
        level: lga
        tier: 1
        discovery: [sokoto_sbs_documents]
        verified: 2026-10-29
      - id: nbs_mpi
        name: NBS Nigeria Multidimensional Poverty Index (MPI) 2022
        domains: [nigerianstat.gov.ng]
        urls:
          - https://nigerianstat.gov.ng/download/1241254
        doc_types: [national MPI report with state MPI, headcount and intensity]
        aliases: [National MPI, Nigeria MPI, Nigeria Multidimensional Poverty Index, Nigeria Child MPI]
        level: state
        tier: 1
