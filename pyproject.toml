[project]
name = "kasafi-agent"
version = "0.1.0"
description = "Kasafi: Hausa voice-first WhatsApp agent for public budget & policy documents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "pypdfium2>=5.14.0",
    "alembic>=1.20.1",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.2",
    "pillow>=13.0.0",
    "fastembed>=0.9.1",
    "pyyaml>=6.0",
    "geopandas>=1.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
