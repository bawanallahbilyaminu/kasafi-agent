# Kasafi API on the VPS. A uniquely named compose project ("kasafi-agent"), network and
# image, so it can't collide with or touch mailcow or any other app on the host.
#
# The container listens only on 127.0.0.1:${KASAFI_PORT}. CloudPanel's nginx forwards
# https://kasafi-api.halalnumeriq.com.ng to it (see deploy/README.md). Secrets come from
# deploy/.env on the server (never committed).
name: kasafi-agent

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        KASAFI_COMMIT: ${KASAFI_COMMIT:-unknown}
    image: kasafi-agent-api:latest
    container_name: kasafi-agent-api
    env_file: .env
    ports:
      - "127.0.0.1:${KASAFI_PORT:-8010}:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp   # ffmpeg temp files
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [kasafi-agent]

networks:
  kasafi-agent:
    name: kasafi-agent
