# Kasafi API on the VPS. Its own compose project ("kasafi") and network, so it doesn't
# touch mailcow or the other apps.
#
# The container listens only on 127.0.0.1:${KASAFI_PORT}. The host's existing HTTPS reverse
# proxy forwards kasafi-api.<domain> to it (see deploy/README.md). Secrets come from
# deploy/.env on the server (copied from .env.example; never committed).
name: kasafi

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kasafi-api:latest
    env_file: .env
    ports:
      - "127.0.0.1:${KASAFI_PORT:-8010}:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp   # ffmpeg temp files
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [kasafi]

networks:
  kasafi:
    name: kasafi
